name: PlatformIO

on:
  pull_request:
    branches:
      - devel
    paths-ignore:
      - '**/README.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pio pkg update 
      - name: Testing All Architectures
        run: |
          pio run -e TTGO_T7 -e TTGO_TDISPLAY -e ESP32C3LOLIN -e ESP32S2LOLIN -e ESP32S3
