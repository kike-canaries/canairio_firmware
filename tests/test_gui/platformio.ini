; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; [platformio]
; default_envs = TTGO_TDISPLAY

[config]
version = 0.7.1
revision = 990
target = dev

[env]
build_type = debug
platform = espressif32 @ 4.4.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = 
  esp32_exception_decoder
  ; time
extra_scripts = pre:prebuild.py
build_flags = 
  -D CORE_DEBUG_LEVEL=0   ; For debugging set to 3 and enable debug mode in the app
  -D EMOTICONS            ; Big emoticons, text and color visualization

[esp32_common]
board = lolin32
board_build.partitions = min_spiffs.csv

[oled_common]
extends = esp32_common
lib_ignore =
  gui-utils-tft
  lorawan
lib_deps = 
  U8g2 @ ^2.28.8

#################################################
# Official guide variant:
# TTGO T7 (d1mini v2) or any esp32dev board 
# with multiple dust, CO2 and env sensors support
#################################################
[env:TTGO_T7]
extends = oled_common

##############################################
# Other boards supported: (with OLED support)
##############################################

# variant for old CanAirIO device v1.0 
[env:WEMOSOLED]
extends = oled_common
upload_speed = 921600

[env:HELTEC]
extends = oled_common

[env:TTGO_TQ]
extends = oled_common

[env:ESP32DEVKIT]
extends = oled_common

[esp32s3_common]
extends = oled_common
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = 
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM=1

[env:XIAO_S3]
extends = esp32s3_common
board = seeed_xiao_esp32s3
board_build.arduino.memory_type = dio_opi ;
board_build.partitions = default_8MB.csv

[env:TTGO_T7S3]
extends = esp32s3_common
board = lilygo_t7s3
build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1

##############################################
# TFT boards supported: 
##############################################
[env:TTGO_TDISPLAY]
extends = esp32_common
board = esp32dev
lib_deps = 
  bodmer/TFT_eSPI @ 2.5.43
lib_ignore = 
  gui-utils-oled
build_flags = 
  ${env.build_flags}
	-Os
  -D USER_SETUP_LOADED=1
  -D MAIN_HW_EN_PIN=27
  -include .pio/libdeps/${PIOENV}/TFT_eSPI/User_Setups/Setup25_TTGO_T_Display.h

[env:M5STICKCPLUS]
extends = esp32_common
board = esp32dev
lib_deps = 
  m5stack/M5Unified@0.2.2
lib_ignore =
  gui-utils-oled
