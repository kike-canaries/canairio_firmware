name: Scheduled

on:
  schedule:
    - cron:  '30 10 * * 4' 

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pio pkg update
      - name: CanAirIO ESP32WOKWI firmware build
        run: |
          ./build wokwi
      - name: CanAirIO ESP32WOKWI execution test
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: tests/wokwi/test_boot
          timeout: 60000
          scenario: 'boot_check.yml'
          serial_log_file: 'log-boot-canairio.txt'
      - name: CanAirIO main Architectures test
        run: |
          ./build ci